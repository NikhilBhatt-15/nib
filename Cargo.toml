[package]
name = "nib"
version = "0.1.1"
edition = "2021"
description = "A fast, private, keyboard-first text editor for Windows."
license = "MIT"
repository = "https://github.com/NikhilBhatt-15/nib"

[dependencies]
encoding_rs = "0.8"
pulldown-cmark = { version = "0.12", default-features = false }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Quicker optimized builds while iterating: `cargo build --profile fast`.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false
debug = "line-tables-only"
